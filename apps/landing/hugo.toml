baseURL = "https://raus.cloud"
languageCode = "en"
title = "Raus.cloud - Infrastructure Without DevOps"

# Enable multilingual mode
# Default language is English, but browser detection in baseof.html will redirect German users to /de/
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content"
    [languages.en.params]
      locale = "en_US"

  [languages.de]
    languageName = "Deutsch"
    weight = 2
    contentDir = "content"
    [languages.de.params]
      locale = "de_DE"

[params]
  description = "Cut your cloud costs by 60-70% and free your engineering team. Infrastructure that doesn't require a DevOps hire. Ever."
  author = "Eduardo Sanchez"
  calendarLink = "https://cal.com/eduardosanzb/15min"

  # Analytics configuration
  # Only enabled in production (HUGO_ENV=production)
  # To test locally: create config/_default/params.toml with enableAnalytics = true
  enableAnalytics = false
  analyticsUrl = "https://analytics.raus.cloud/script.js"
  analyticsWebsiteId = "268a904e-a27e-49ac-943e-9012ef9f0875"

[module]
  [[module.imports]]
    path = "github.com/hugomods/mermaid"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[build]
  writeStats = true
