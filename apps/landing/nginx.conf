server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Cache all static assets aggressively (fingerprinted by build)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # Enable CORS for fonts
        if ($request_filename ~* \.(woff|woff2|ttf|eot)$) {
            add_header Access-Control-Allow-Origin "*" always;
        }
    }

    # Cache HTML pages for a short time (5 minutes)
    # This allows Cloudflare to cache but still get updates relatively quickly
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Main location - serve Hugo site
    location / {
        # Cache homepage for 5 minutes
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # German language support
    location /de/ {
        # Cache for 5 minutes
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/ /de/index.html;
    }

    # PocketBase API proxy — assessment form submissions from /cloudfest/assessment/
    # Uses Docker's internal DNS resolver (127.0.0.11) with a set variable so nginx
    # resolves 'pocketbase' dynamically at request time, not at startup. This prevents
    # startup errors if PocketBase isn't ready yet. Fully compatible with Coolify/Traefik
    # since Traefik only routes to port 80 (nginx); PocketBase is never exposed externally.
    location /pb/ {
        resolver 127.0.0.11 valid=30s;
        set $pb_upstream http://pocketbase:8090;
        rewrite ^/pb/(.*)$ /$1 break;
        proxy_pass $pb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;

        # No caching for API calls
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
