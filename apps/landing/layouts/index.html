{{ define "main" }}

<!-- Hero Section -->
{{ partial "sections/hero.html" . }}

<!-- Marquee Strip (below hero, desktop only) -->
<div class="hidden md:block bg-brand-accent py-2">
  <div class="container-custom">
    {{ partial "blog-marquee.html" . }}
  </div>
</div>

<!-- Dynamic Sections Loop -->
{{ range .Params.sections }}
  {{ partial "section.html" (dict "data" (index $.Params .) "context" $ "sectionName" .) }}
{{ end }}

<!-- Final CTA Section -->
{{ partial "sections/cta.html" . }}

{{ end }}
