<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ .Site.Params.description }}">
  <meta name="author" content="{{ .Site.Params.author }}">

  <title>{{ .Site.Title }}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ .Site.Title }}">
  <meta property="og:description" content="{{ .Site.Params.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Site.Title }}">
  <meta name="twitter:description" content="{{ .Site.Params.description }}">

  <!-- Dark mode script - must run before body renders to avoid flash -->
  <script>
    // Initialize theme from localStorage or system preference
    (function() {
      const theme = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();

    // Detect browser language and redirect if needed
    (function() {
      const currentLang = document.documentElement.lang;
      const browserLang = navigator.language || navigator.userLanguage;
      const isGerman = browserLang.toLowerCase().startsWith('de');
      const isOnRoot = window.location.pathname === '/' || window.location.pathname === '';

      // Only redirect if on root path and browser language doesn't match
      if (isOnRoot) {
        if (isGerman && currentLang !== 'de') {
          window.location.href = '/de/';
        } else if (!isGerman && currentLang === 'de') {
          window.location.href = '/';
        }
      }
    })();
  </script>
</head>
<body{{ if eq .Type "blog" }} class="blog-post"{{ end }}>
  {{ partial "header.html" . }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  {{ if .Site.Params.enableAnalytics }}
  <!-- Umami Analytics (Privacy-first, self-hosted) -->
  <!-- Only loaded in production (HUGO_ENV=production) or when enableAnalytics=true -->
  <script defer src="{{ .Site.Params.analyticsUrl }}"
          data-website-id="{{ .Site.Params.analyticsWebsiteId }}"
          data-auto-track="true"
          data-do-not-track="true"></script>

  <!-- Custom analytics tracking (scroll, CTA, reading time) -->
  <script defer src="/js/analytics.js"></script>
  {{ end }}

  <!-- Alpine.js for interactive components -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Mermaid.js for diagrams -->
  {{ if .Params.mermaid }}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

    const isDark = document.documentElement.classList.contains('dark');

    mermaid.initialize({
      startOnLoad: true,
      theme: 'base',
      themeVariables: isDark ? {
        // Dark mode theme - white text on dark nodes
        primaryColor: '#0f1419',      // dark node background
        primaryTextColor: '#ffffff',   // WHITE text
        primaryBorderColor: '#10b981', // emerald border
        lineColor: '#10b981',          // emerald lines
        secondaryColor: '#1f2937',     // secondary nodes
        tertiaryColor: '#1f2937',      // tertiary
        background: '#0a0a0a',         // diagram background
        mainBkg: '#0f1419',           // main node background
        secondBkg: '#1f2937',         // secondary node background
        border1: '#10b981',           // emerald
        border2: '#059669',           // darker emerald
        note: '#0f1419',
        noteBkgColor: '#0f1419',
        noteTextColor: '#ffffff',     // WHITE
        noteBorderColor: '#10b981',
        clusterBkg: '#0f1419',
        clusterBorder: '#10b981',
        defaultLinkColor: '#10b981',
        titleColor: '#ffffff',        // WHITE
        edgeLabelBackground: '#0a0a0a',
        edgeLabelColor: '#ffffff',    // WHITE edge labels
        actorBorder: '#10b981',
        actorBkg: '#0f1419',
        actorTextColor: '#ffffff',    // WHITE
        actorLineColor: '#10b981',
        signalColor: '#ffffff',       // WHITE
        signalTextColor: '#ffffff',   // WHITE
        labelBoxBkgColor: '#0f1419',
        labelBoxBorderColor: '#10b981',
        labelTextColor: '#ffffff',    // WHITE
        loopTextColor: '#ffffff',     // WHITE
        activationBorderColor: '#10b981',
        activationBkgColor: '#0f1419',
        sequenceNumberColor: '#ffffff' // WHITE
      } : {
        // Light mode theme - dark text on light nodes
        primaryColor: '#ffffff',      // white node background
        primaryTextColor: '#0a0a0a',   // DARK text
        primaryBorderColor: '#10b981', // emerald border
        lineColor: '#10b981',          // emerald lines
        secondaryColor: '#f3f4f6',     // light gray nodes
        tertiaryColor: '#ecfdf5',      // light emerald tint
        background: '#ffffff',         // white background
        mainBkg: '#ffffff',           // white node background
        secondBkg: '#f3f4f6',         // light gray
        border1: '#10b981',           // emerald
        border2: '#059669',           // darker emerald
        note: '#ffffff',
        noteBkgColor: '#ffffff',
        noteTextColor: '#0a0a0a',     // DARK
        noteBorderColor: '#10b981',
        clusterBkg: '#f9fafb',        // very light gray for clusters
        clusterBorder: '#10b981',
        defaultLinkColor: '#10b981',
        titleColor: '#0a0a0a',        // DARK
        edgeLabelBackground: '#ffffff',
        edgeLabelColor: '#0a0a0a',    // DARK edge labels
        actorBorder: '#10b981',
        actorBkg: '#ffffff',
        actorTextColor: '#0a0a0a',    // DARK
        actorLineColor: '#10b981',
        signalColor: '#0a0a0a',       // DARK
        signalTextColor: '#0a0a0a',   // DARK
        labelBoxBkgColor: '#ffffff',
        labelBoxBorderColor: '#10b981',
        labelTextColor: '#0a0a0a',    // DARK
        loopTextColor: '#0a0a0a',     // DARK
        activationBorderColor: '#10b981',
        activationBkgColor: '#ffffff',
        sequenceNumberColor: '#0a0a0a' // DARK
      },
      flowchart: {
        curve: 'basis',
        padding: 20,
        nodeSpacing: 50,
        rankSpacing: 50,
        diagramPadding: 20,
        htmlLabels: true
      },
      fontSize: 16,
      fontFamily: 'ui-sans-serif, system-ui, sans-serif'
    });

    // Re-render on theme change
    window.addEventListener('theme-changed', (e) => {
      const isDark = e.detail.theme === 'dark';
      mermaid.initialize({
        theme: 'base',
        themeVariables: isDark ? {
          primaryColor: '#0f1419',
          primaryTextColor: '#ffffff',
          primaryBorderColor: '#10b981',
          lineColor: '#10b981',
          secondaryColor: '#1f2937',
          tertiaryColor: '#1f2937',
          background: '#0a0a0a',
          mainBkg: '#0f1419',
          secondBkg: '#1f2937',
          border1: '#10b981',
          border2: '#059669',
          clusterBkg: '#0f1419',
          clusterBorder: '#10b981',
          defaultLinkColor: '#10b981',
          titleColor: '#ffffff',
          edgeLabelBackground: '#0a0a0a',
          edgeLabelColor: '#ffffff'
        } : {
          primaryColor: '#ffffff',
          primaryTextColor: '#0a0a0a',
          primaryBorderColor: '#10b981',
          lineColor: '#10b981',
          secondaryColor: '#f3f4f6',
          tertiaryColor: '#ecfdf5',
          background: '#ffffff',
          mainBkg: '#ffffff',
          secondBkg: '#f3f4f6',
          border1: '#10b981',
          border2: '#059669',
          clusterBkg: '#f9fafb',
          clusterBorder: '#10b981',
          defaultLinkColor: '#10b981',
          titleColor: '#0a0a0a',
          edgeLabelBackground: '#ffffff',
          edgeLabelColor: '#0a0a0a'
        }
      });

      document.querySelectorAll('.mermaid').forEach(el => {
        const originalContent = el.getAttribute('data-original-content') || el.textContent;
        el.setAttribute('data-original-content', originalContent);
        mermaid.render('mermaid-' + Math.random(), originalContent).then(result => {
          el.innerHTML = result.svg;
        });
      });
    });
  </script>
  {{ end }}

  <!-- Theme toggle functionality -->
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.classList.contains('dark') ? 'dark' : 'light';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

      if (newTheme === 'dark') {
        html.classList.add('dark');
      } else {
        html.classList.remove('dark');
      }

      localStorage.setItem('theme', newTheme);

      // Dispatch custom event for other components
      window.dispatchEvent(new CustomEvent('theme-changed', { detail: { theme: newTheme } }));
    }

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      // Only auto-switch if user hasn't manually set a preference
      if (!localStorage.getItem('theme')) {
        if (e.matches) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }
    });
  </script>
</body>
</html>
