
version: '1.0'

services:
  landing:
    build:
      dockerfile: Dockerfile
      context: apps/landing
    # Coolify binds raus.cloud to this service on container port 80.
    # nginx is baked into this image and serves the Hugo static site.
    ports:
      - 80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  pocketbase:
    build:
      context: infra/pocketbase
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - ./pocketbase migrate up --dir=/pb/pb_data --migrationsDir=/pb/pb_migrations && exec ./pocketbase serve --http=0.0.0.0:8090 --dir=/pb/pb_data --migrationsDir=/pb/pb_migrations
    # Coolify binds admin.raus.cloud to this service on container port 8090.
    # Admin UI: https://admin.raus.cloud/_/
    # API:      https://admin.raus.cloud/api/
    # After first deploy, create superuser:
    #   docker exec <container> ./pocketbase superuser upsert admin@raus.cloud <pass>
    ports:
      - 8090
    volumes:
      - pocketbase_data:/pb/pb_data
      - ./infra/pocketbase/pb_migrations:/pb/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


resources:
  landing:
    memory: 64M       # Static nginx site
    cpu: 0.05         # Minimal resources
  pocketbase:
    memory: 128M      # PocketBase Go binary + SQLite
    cpu: 0.05         # Minimal CPU for survey workload

volumes:
  pocketbase_data:
